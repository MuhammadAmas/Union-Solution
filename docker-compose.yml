services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callout
      POSTGRES_USER: callout
      POSTGRES_PASSWORD: callout
    ports:
      - "5433:5432"
    volumes:
      - callout_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callout"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: callout
      POSTGRES_USER: callout
      POSTGRES_PASSWORD: callout
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser (not the frontend container) calls this URL, so it must
        # be the host-published address of the backend, not the in-network
        # "backend" hostname.
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  callout_pg_data:
